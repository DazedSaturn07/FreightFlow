[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freightflow"
version = "0.1.0"
description = "Governed FAF5.7.1 freight lane and capacity scenario analytics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "openpyxl>=3.1,<4",
  "pymysql>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
freightflow = "freightflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freightflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
